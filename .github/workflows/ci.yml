name: Validate Dayframe

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run build, rendered HTML tests, lint, and artifact validation
        env:
          NEXT_PUBLIC_CONVEX_URL: http://127.0.0.1:3210
        run: npm test && npx tsc --noEmit && npm run lint && npm run validate:artifact
